<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 과제 제출 현황</title>
<style>
html{color-scheme:light}
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2933;--muted:#7b8794;--line:#e6e8ec;
--ok:#10b981;--okbg:#e7f7f0;--no:#ef4444;--nobg:#fdeceb;--accent:#4f46e5;--accent2:#eef0fd;--na:#cbd2d9;
--warnbg:#fff7ed;--warn:#d97706;--warnline:#fed7aa;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:30px 16px 70px;}
.login{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 26px;
text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-top:18px;}
.login h1{font-size:21px;margin:0 0 6px;}
.login p{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5;}
.lf{display:flex;gap:8px;max-width:360px;margin:0 auto;}
.lf input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;outline:none;}
.lf input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.lf button{padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.lf button:hover{background:#4338ca;}
.err{color:var(--no);font-size:13px;margin-top:12px;min-height:18px;}
.note{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.5;}
.dash{display:none;}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin:6px 0 8px;}
.top .nm{font-size:24px;font-weight:700;} .top .sid{color:var(--muted);font-size:14px;margin-left:8px;}
.asof{color:var(--muted);font-size:12px;margin-bottom:16px;}
.back{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:13px;cursor:pointer;}
.banner{border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:15px;font-weight:600;}
.banner.ok{background:var(--okbg);color:#047857;border:1px solid #a7f3d0;}
.banner.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline);}
.banner .miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{background:#fff;border:1px solid var(--warnline);color:var(--warn);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card h2{font-size:14px;margin:0 0 14px;color:#3e4c59;}
.alist{display:flex;flex-direction:column;gap:10px;}
.ai{border:1px solid var(--line);border-radius:11px;padding:12px 14px;}
.ai.miss{border-color:var(--warnline);background:#fffdfa;}
.ai .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.ai .ti{font-weight:600;font-size:14px;} .ai .ti small{color:var(--muted);font-weight:400;margin-left:6px;}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.tag.o{background:var(--okbg);color:var(--ok);} .tag.x{background:var(--nobg);color:var(--no);}
.ai .sc{font-size:13px;color:var(--accent);font-weight:700;margin-left:8px;}
.ai .fb{font-size:13px;color:#52606d;line-height:1.55;margin-top:6px;}
.kpis{display:flex;gap:12px;flex-wrap:wrap;}
.kpi{flex:1;min-width:90px;background:var(--accent2);border-radius:11px;padding:12px;text-align:center;}
.kpi b{display:block;font-size:22px;color:var(--accent);} .kpi span{font-size:12px;color:var(--muted);}
.weeks{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.wk{width:42px;text-align:center;font-size:11px;}
.wk .lbl{color:var(--muted);margin-bottom:3px;}
.dot{display:flex;align-items:center;justify-content:center;height:26px;border-radius:7px;font-weight:700;font-size:12px;}
.dot.o{background:var(--okbg);color:var(--ok);} .dot.x{background:var(--nobg);color:var(--no);}
.dot.na{background:#f0f1f4;color:var(--na);}
.dot.mid{background:#ede9fe;color:#7c3aed;font-size:11px;}
.dot.fin{background:#dbeafe;color:#2563eb;font-size:10px;}
.wk.now .lbl{color:var(--accent);font-weight:700;}
.anote{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5;}
.foot{color:var(--muted);font-size:11px;text-align:center;margin-top:8px;}
</style></head><body>
<div class="wrap">
  <div class="login" id="login">
    <h1>내 과제 제출 현황</h1>
    <p id="ctitle"></p>
    <div class="lf">
      <input id="sid" type="text" inputmode="numeric" placeholder="학번 입력" autocomplete="off">
      <button id="go">조회</button>
    </div>
    <div class="err" id="err"></div>
    <div class="note">본인 학번으로만 조회됩니다. 데이터는 학번으로 암호화되어 있어 다른 사람 정보는 보이지 않습니다.</div>
  </div>

  <div class="dash" id="dash">
    <div class="top">
      <div><span class="nm" id="d_nm"></span><span class="sid" id="d_sid"></span></div>
      <button class="back" id="back">← 다른 학번 조회</button>
    </div>
    <div class="asof" id="asof"></div>
    <div id="banner"></div>
    <div class="card">
      <h2>과제별 제출 현황</h2>
      <div class="alist" id="alist"></div>
    </div>
    <div class="card" id="attCard">
      <h2>출결</h2>
      <div class="kpis" id="attKpi"></div>
      <div class="weeks" id="attWeeks"></div>
      <div class="anote" id="attNote"></div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</div>

async function sha256hex(str){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function lookup(sid){

  const e=ENC[await sha256hex(sid)]; if(!e) return null;

        mat,{name:'AES-GCM',length:256},false,['decrypt']);

      return JSON.parse(new TextDecoder().decode(pt));}catch(_){return null;}

  d.assigns.forEach(a=>{
    al+=`<div class="ai${a.ok?'':' miss'}"><div class="hd"><div class="ti">${esc(a.code)}<small>${esc(a.title.replace(/^A\d+\.\s*/,''))}</small>`+
        (a.ok&&a.score!==''?`<span class="sc">${esc(a.score)}점</span>`:'')+`</div>`+
        (a.ok?'<span class="tag o">제출</span>':'<span class="tag x">미제출</span>')+`</div>`;
    if(a.ok&&a.fb) al+=`<div class="fb">${esc(a.fb)}</div>`;
    al+='</div>';
  });
  document.getElementById('alist').innerHTML=al;
  // 출결
  const ac=document.getElementById('attCard');
  if(d.att){ ac.style.display='block';
    document.getElementById('attKpi').innerHTML=
      `<div class="kpi"><b>${esc(d.att.present)}</b><span>출석</span></div>`+
      `<div class="kpi"><b>${esc(d.att.absent)}</b><span>결석</span></div>`+
      `<div class="kpi"><b>${esc(d.att.score)}</b><span>출석점수</span></div>`;
    let w='';
    d.att.weeks.forEach((v,i)=>{
      let cls=v==='O'?'o':v==='X'?'x':'na', t=v==='O'?'O':v==='X'?'X':'–', tip='', wkcls='wk', lbl=(i+1)+'주';
      if(i===11){cls='mid';t='중';tip=' title="중간고사 대체 (출결 성적 미반영)"';}
      else if(i===15){cls='fin';t='기말';tip=' title="기말고사"';}
      else if(i===14){wkcls='wk now';tip=' title="현재 출석인정기간"';lbl='15주*';}
      w+=`<div class="${wkcls}"${tip}><div class="lbl">${lbl}</div><div class="dot ${cls}">${t}</div></div>`;});
    document.getElementById('attWeeks').innerHTML=w;
    document.getElementById('attNote').textContent=META.att_note||'';
  } else { ac.style.display='none'; }
  window.scrollTo(0,0);
}
async function go(){
  const sid=document.getElementById('sid').value.trim();
  const err=document.getElementById('err'); err.textContent='';
  if(!sid){err.textContent='학번을 입력하세요.';return;}
  try{const d=await lookup(sid);
    if(!d){err.textContent='해당 학번을 찾을 수 없습니다. 다시 확인해주세요.';return;}
    render(d);
  }catch(e){err.textContent=(e==='nocrypto')?'이 브라우저에서는 조회가 안 됩니다. 크롬으로 열어주세요.':'오류가 발생했습니다.';}
}
document.getElementById('go').addEventListener('click',go);
document.getElementById('sid').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
document.getElementById('back').addEventListener('click',()=>{
  document.getElementById('dash').style.display='none';
  document.getElementById('login').style.display='block';
  document.getElementById('sid').value=''; document.getElementById('err').textContent='';
  document.getElementById('sid').focus();
});
</script></body></html>
